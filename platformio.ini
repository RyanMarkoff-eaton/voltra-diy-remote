[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.3.6
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; Confirmed ESP32-S3, 16 MB quad flash, 8 MB embedded PSRAM.
; BLE/serial bench only: no display, touch or encoder GPIOs initialized.
[env:elecrow21_ble]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
upload_port = COM6
monitor_port = COM6

[env:elecrow21_ui]
extends = env:elecrow21_ble
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.4.7
build_flags =
    ${env:elecrow21_ble.build_flags}
    -DVOLTRA_DISPLAY=1
